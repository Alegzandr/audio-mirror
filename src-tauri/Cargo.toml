[package]
name = "audio-mirror"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Mirrors one audio source to several outputs"
license = "MIT"

[lib]
name = "audio_mirror_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["image-png", "tray-icon"] }
tauri-plugin-updater = "2.11"
tauri-plugin-process = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
rubato = "5"
rtrb = "0.4"
parking_lot = "0.12"
log = "0.4"
tauri-plugin-autostart = "2.5"
tauri-plugin-single-instance = "2.4"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }

[target.'cfg(windows)'.dependencies]
self-replace = "1.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
