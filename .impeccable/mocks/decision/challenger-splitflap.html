<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Audio Mirror, Tableau des départs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --frame: #2a2b2d; --board: #121213; --flap: #1d1d1f; --ink: #f2f2ee; --dim: #8d8d88; --amber: #f5a623; --red: #d0503f; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 380px; height: 560px; overflow: hidden; }
  body { background: var(--frame); font: 600 15px/1.2 "Barlow Condensed", sans-serif; color: var(--ink); padding: 10px; }
  .board { background: var(--board); height: 100%; border-radius: 4px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 1px 2px rgba(0,0,0,0.5); padding: 14px 14px 12px; display: flex; flex-direction: column; }
  .head { display: flex; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .clock { font-size: 22px; font-weight: 700; color: var(--amber); letter-spacing: 0.04em; }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: var(--dim); text-transform: uppercase; }
  .cells { display: inline-flex; gap: 2px; }
  .cells span { width: 15px; height: 24px; display: grid; place-items: center; background: linear-gradient(var(--flap) 0 49%, #000 49% 51%, #232325 51%); border-radius: 2px; font-size: 17px; font-weight: 700; }
  .src { margin-top: 14px; padding-bottom: 12px; border-bottom: 1px solid #2c2c2e; }
  .src-name { font-size: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; margin: 3px 0 8px; }
  .meter { height: 5px; background: #2a2a2c; border-radius: 1px; } .meter b { display: block; height: 100%; width: 72%; background: var(--ink); }
  .cols { display: grid; grid-template-columns: 1fr 56px 104px; gap: 10px; margin: 12px 0 4px; }
  .dep { display: grid; grid-template-columns: 1fr 56px 104px; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid #222224; }
  .dest { font-size: 19px; text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .via { font-size: 12px; font-weight: 500; color: var(--dim); letter-spacing: 0.06em; text-transform: uppercase; }
  .vol { font-size: 17px; text-align: right; }
  .ctl { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .slider { flex: 1; height: 4px; background: #2e2e30; position: relative; border-radius: 2px; }
  .slider b { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 2px; }
  .slider u { position: absolute; top: -6px; width: 6px; height: 16px; background: var(--ink); border-radius: 1px; }
  .btn { font: inherit; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); background: #2a2a2c; border: 0; border-radius: 3px; padding: 5px 10px; }
  .amber span { color: var(--amber); } .red .dest { color: var(--red); }
  .more { margin-top: auto; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #2c2c2e; padding-top: 10px; }
</style>
</head>
<body>
<div class="board">
  <div class="head"><h1>Audio Mirror</h1><span class="clock">21:04</span></div>
  <div class="src">
    <div class="lbl">Provenance</div>
    <div class="src-name">Sortie par défaut · Speakers</div>
    <div class="meter"><b></b></div>
  </div>
  <div class="cols lbl"><span>Destination</span><span style="text-align:right">Vol.</span><span>État</span></div>
  <div class="dep">
    <div><div class="dest">Headphones</div><div class="via">USB Audio</div></div>
    <div class="vol">−4,0</div>
    <div class="cells"><span>E</span><span>N</span><span>&nbsp;</span><span>L</span><span>E</span><span>C</span></div>
    <div class="ctl"><div class="slider"><b style="width:78%"></b><u style="left:78%"></u></div><button class="btn">Couper</button></div>
  </div>
  <div class="dep">
    <div><div class="dest">OBS</div><div class="via">VB-Audio Virtual Cable</div></div>
    <div class="vol">0,0</div>
    <div class="cells"><span>E</span><span>N</span><span>&nbsp;</span><span>L</span><span>E</span><span>C</span></div>
    <div class="ctl"><div class="slider"><b style="width:96%"></b><u style="left:96%"></u></div><button class="btn">Couper</button></div>
  </div>
  <div class="dep red">
    <div><div class="dest">LG Ultragear</div><div class="via">NVIDIA High Definition Audio</div></div>
    <div class="vol">−12,6</div>
    <div class="cells amber"><span>E</span><span>S</span><span>S</span><span>A</span><span>I</span><span>3</span></div>
  </div>
  <div class="more"><span class="lbl">2 autres destinations</span><button class="btn">Afficher</button></div>
</div>
</body>
</html>
